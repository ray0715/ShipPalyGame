:wrap;margin:25px 0 15px}.clock{font-variant-numeric:tabular-nums;letter-spacing:.04em;font-size:23px;border:4px solid #303033;padding:8px 13px;background:#f5d36e;box-shadow:4px 4px 0 #303033;font-weight:900}.clock.low{color:#b22b30;background:#ffe1bc}.columns{display:grid;grid-template-columns:1fr 1.16fr;gap:16px}.panel{background:#f8f5cc;border:4px solid #303033;padding:17px;box-shadow:5px 5px 0 #77a79c}.clues{margin:0;padding:0;list-style:none;display:grid;gap:10px}.clues li{display:flex;gap:9px;align-items:flex-start;line-height:1.7;font-size:14px;background:#e5edb2;border:2px solid #8baa6b;padding:9px}.num{background:#303033;color:#f9d061;padding:1px 4px;font-weight:900;min-width:25px;text-align:center}.hint{border-top:3px dashed #87a266;margin-top:16px;padding-top:11px;color:#555;line-height:1.75;font-size:13px}.stage{background:repeating-linear-gradient(0deg,#7ed5e9 0px,#7ed5e9 15px,#84cfe1 16px,#84cfe1 18px);border:4px solid #303033;padding:12px;text-align:center}.stage-title{font-weight:950;font-size:13px;letter-spacing:.05em;color:#303033}.slots{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;margin:14px 0 11px}.slot{height:110px;background:#fff8d6;border:3px dashed #6b7b69;color:#333;padding:3px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:0}.slot .n{font-size:11px;font-weight:900;color:#755e30}.slot.filled{border-style:solid;background:#d9eab0}.slot .dress{font-size:32px}.slot .sname{font-size:12px;font-weight:900}.small{font-size:12px;color:#505044;line-height:1.75}.wardrobe{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:12px}.look{border-radius:0;border:3px solid #303033;background:#dcf0bc;color:#303033;min-height:125px;padding:7px 2px;display:flex;align-items:center;justify-content:center;gap:5px;flex-direction:column;box-shadow:2px 3px 0 #6f8870}.look .dress{font-size:31px}.look .sname{font-size:14px;font-weight:900}.look.selected{background:#f5d46f;outline:3px solid #bb5c2b}.look.used{opacity:.33}.material-note{font-size:10px;color:#3e5042;text-align:center;line-height:1.35;padding:0 1px}.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.action{border:3px solid #303033;border-radius:0;padding:10px 13px;background:#f8edb8;color:#303033;font-weight:900;box-shadow:3px 3px 0 #303033}.action.primary{background:#f4c355}.action:disabled{opacity:.43;cursor:default}.feedback{min-height:46px;padding-top:13px;font-size:14px;line-height:1.65;font-weight:700}.result{display:none;background:#d7edac;border:5px solid #303033;box-shadow:6px 6px 0 #6a9e88;margin-top:20px;padding:25px;text-align:center}.result.visible{display:block}.result .answer{font-size:clamp(70px,16vw,120px);line-height:1.25;color:#ae4834;text-shadow:4px 4px 0 #f3d56c;font-weight:950}.footer{font-size:12px;color:#565b48;margin-top:20px;line-height:1.7}#game{display:none}.reveal{animation:rise .6s ease both}@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}.diary-tab{background:#303033;color:#fff7cb;display:inline-block;font-size:20px;font-weight:950;padding:13px 22px;clip-path:polygon(0 0,100% 0,94% 100%,0 100%);margin-top:20px}.chapter{font-size:11px;font-weight:900;color:#d9c16d;display:block;margin-top:4px}.story{border-left:5px solid #d18c49;margin:19px 0;padding:4px 16px;line-height:2.05;background:#ffffff55}.island-art{height:190px;position:relative;overflow:hidden;border:5px solid #303033;background:linear-gradient(#73c6ec 0 54%,#a1dcef 54% 70%,#3488bc 70% 85%,#206096 85%);margin-top:14px;image-rendering:pixelated}.sun{position:absolute;right:38px;top:20px;background:#f9ca5b;width:49px;height:49px;border:5px solid #333;border-radius:50%;box-shadow:0 0 0 5px #e6a849}.cloud{position:absolute;left:52px;top:35px;background:#fff;width:70px;height:23px;border:4px solid #333;box-shadow:12px -12px 0 -1px white,12px -12px 0 3px #333}.island{position:absolute;left:12%;bottom:23px;width:125px;height:55px;background:#f3e0ac;clip-path:polygon(25% 0,70% 0,100% 68%,82% 100%,15% 100%,0 65%);border-bottom:7px solid #333}.palm{position:absolute;left:calc(12% + 56px);bottom:68px;width:11px;height:69px;background:#694c28;transform:rotate(-5deg)}.palm:before{content:'🌴';position:absolute;font-size:62px;left:-29px;top:-39px}.boat{position:absolute;right:18%;bottom:32px;font-size:70px;filter:drop-shadow(3px 3px #323234)}.island-note{position:absolute;left:44%;bottom:18px;background:#ffe1a3;border:3px solid #303033;padding:5px 10px;font-size:12px;font-weight:950}.startbar{margin:14px 0 3px;padding:10px 12px;border:3px solid #303033;background:#a4d27d;font-weight:900}.pixel-icon{font-size:28px;image-rendering:pixelated}.guide{padding:8px 12px;background:#dfecb9;border:2px dashed #8cb166;margin-bottom:16px;font-size:13px;line-height:1.8}@media(max-width:750px){.shell{margin:0;padding:15px 11px 32px;border-width:7px;box-shadow:inset 0 0 0 4px #303033}.columns{grid-template-columns:1fr}.panel{padding:11px}.slot{height:98px}.slot .dress,.look .dress{font-size:24px}.slot .sname,.look .sname{font-size:11px}.look{min-height:109px;padding:5px 1px}.material-note{font-size:9px}.team{font-size:12px;padding:11px 2px}.island-art{height:155px}.boat{right:13%;font-size:53px}.island-note{left:47%;font-size:10px}.top small{font-size:9px}}


.cam{position:relative;background:#000;border:4px solid #303033;aspect-ratio:4/3;overflow:hidden}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam .frame{position:absolute;inset:18%;border:4px dashed #ffd45c}
.cam .msg{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);color:#fff;text-align:center;padding:6px;font-size:14px}
.manual{display:flex;gap:8px;margin-top:8px}.manual input{flex:1;font:inherit;font-size:18px;padding:8px;border:3px solid #303033}
.manual button{font:inherit;font-weight:900;padding:8px 14px;border:3px solid #303033;background:#fff8d3}
.ord{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:#fff;border:3px solid #303033;padding:10px;margin-bottom:8px}
.ord.done{background:#e4f5dc}.ord .k{font-weight:900;color:#fff;padding:2px 8px}.send{background:#1e73c8}.pick{background:#e8743b}
.ord b{font-size:17px}.ord small{display:block;color:#555}.cnt{font-size:22px;font-weight:900}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:60;min-width:280px;max-width:92vw;padding:16px 18px;border:4px solid #303033;box-shadow:5px 5px 0 #303033;font-size:20px;font-weight:900;text-align:center;display:none}
.toast.ok{background:#e4f5dc}.toast.bad{background:#ffe1dc}.toast.warn{background:#fff3c4}.toast.info{background:#dcefff}
.pending{margin-top:8px;padding:10px;border:3px dashed #1e73c8;background:#eef6ff;font-weight:900;display:none}

</style>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script></head><body><main class="shell">
<header class="top"><span class="brand">漂流日記</span><small>CARGO SCAN · 試玩版</small></header>
<section id="s1"><div class="diary-tab">限時理貨大挑戰 <span class="chapter">SCAN STATION</span></div><h1>掃描驗貨站</h1>
<div class="story">每張貨物卡都有 QR Code。搬運員把貨拿到驗貨站，<strong>先掃貨物、再掃要放的位置</strong>，系統會告訴你對不對！<br><br>先選關主告訴你們的版本：</div>
<div class="buttons" style="justify-content:center"><button class="action primary" data-v="A" style="font-size:28px;padding:16px 40px">A 版</button><button class="action primary" data-v="B" style="font-size:28px;padding:16px 40px">B 版</button></div>
<label class="switch"><input type="checkbox" id="needLoc" checked> 進階：放貨前也要掃位置 QR Code（基隆港／高雄港／取件區）</label></section>
<section id="s2" style="display:none">
<div class="headerrow"><div><div class="eyebrow" id="vlabel"></div><h1 style="margin:4px 0 0;font-size:clamp(24px,4vw,34px)">掃描驗貨站 <span class="pixel-icon">📷</span></h1></div><div class="clock" id="clock">00:00</div></div>
<section class="panel"><div class="cam"><video id="video" playsinline muted></video><div class="frame"></div><div class="msg" id="cammsg">正在開啟相機…</div></div>
<div class="pending" id="pending"></div>
<div class="manual"><input id="code" placeholder="相機不靈？輸入卡片下方代碼，例如 G01、KL"><button id="go">送出</button></div></section>
<section class="panel" style="margin-top:12px"><h2>📋 委託單進度 <span id="prog"></span></h2><div id="orders"></div>
<div class="buttons"><button class="action" id="back">返回</button></div></section></section>
<section id="s3" style="display:none"><section class="panel" style="text-align:center"><div class="eyebrow">ALL CLEAR</div><div class="big">🎉 驗櫃成功！</div><p class="lede">6 張委託單全部完成，用時 <b id="tt"></b>。<br>請關主確認後蓋上驗櫃章！</p><button class="action primary" id="again">再玩一次</button></section></section>
<div class="toast" id="toast"></div>
</main><script>
(()=>{'use strict';
const G=Object.fromEntries([["G01", "新鮮鳳梨", "冷藏"], ["G02", "鳳梨罐頭", "常溫"], ["G03", "鮮奶", "冷藏"], ["G04", "奶粉", "常溫"], ["G05", "咖啡豆", "常溫"], ["G06", "即溶咖啡", "常溫"], ["G07", "冷凍魚", "冷凍"], ["G08", "魚罐頭", "常溫"], ["G09", "雞蛋", "冷藏"], ["G10", "皮蛋", "常溫"], ["G11", "冰淇淋", "冷凍"], ["G12", "冰淇淋造型餅乾", "常溫"], ["G13", "茶葉", "常溫"], ["G14", "冷泡茶", "冷藏"], ["G15", "白米", "常溫"], ["G16", "米漿", "冷藏"], ["G17", "香蕉乾", "常溫"], ["G18", "新鮮香蕉", "冷藏"]].map(g=>[g[0],{name:g[1],cat:g[2]}]));
const ORD={"A": [["三重扶青社", "洪珮綺 Penny", "送貨", "G01", 2], ["土城扶青社", "陳士驊 Reno", "取件", "G03", 1], ["宜蘭扶青社", "林嘉俊 Jun", "送貨", "G13", 3], ["新莊中央扶青社", "朱博瑋 Jackson", "取件", "G05", 2], ["板橋扶青社", "廖健夆 Elijah", "送貨", "G07", 1], ["漢林扶青社", "林美玲 Clove", "取件", "G15", 2]], "B": [["福爾摩莎扶青社", "蘇家豪 Oliver", "送貨", "G02", 2], ["三東湧蓮扶青社", "劉禹昕 Cissy", "取件", "G09", 1], ["基隆扶青社", "林佑恩 Louis", "送貨", "G04", 2], ["三角湧扶青社", "葉育如 Christina", "取件", "G11", 1], ["新北阿囉哈扶青社", "鄭慧敏 Anson", "送貨", "G06", 3], ["新北圓桌扶青社", "王嘉渝 Kachina", "取件", "G17", 2]]};
const LOC={KL:'基隆港',KH:'高雄港',PU:'取件區'};
let ver='A',cnt=[],t0=0,timer=null,stream=null,raf=null,pending=null,last='',lastT=0,ended=false;
const $=id=>document.getElementById(id);
function beep(ok){try{const a=new (window.AudioContext||window.webkitAudioContext)();const o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.type=ok?'sine':'square';o.frequency.value=ok?880:180;g.gain.value=.15;o.start();o.stop(a.currentTime+(ok?.15:.4));}catch(e){}}
function toast(t,c){const el=$('toast');el.textContent=t;el.className='toast '+c;el.style.display='block';clearTimeout(el._t);el._t=setTimeout(()=>el.style.display='none',2600);}
function dest(o){return o[2]==='取件'?'PU':(G[o[3]].cat==='常溫'?'KH':'KL');}
function render(){const O=ORD[ver];const n=O.filter((o,i)=>cnt[i]>=o[4]).length;$('prog').textContent=`${n}／6`;
 $('orders').innerHTML=O.map((o,i)=>`<div class="ord ${cnt[i]>=o[4]?'done':''}"><span class="k ${o[2]==='送貨'?'send':'pick'}">${o[2]}</span><div><b>${G[o[3]].name}</b><small>${o[0]}　${o[1]}</small></div><span class="cnt">${cnt[i]}／${o[4]}</span></div>`).join('');
 if(n===6&&!ended){ended=true;clearInterval(timer);stopCam();$('tt').textContent=$('clock').textContent;$('s2').style.display='none';$('s3').style.display='block';beep(true);}}
function handle(raw){const code=String(raw).trim().toUpperCase().replace(/^DRIFT:/,'').replace(/^L-/,'');const now=Date.now();if(code===last&&now-lastT<2000)return;last=code;lastT=now;
 if(LOC[code]){ if(!pending){toast('請先掃描貨物，再掃位置','info');return;}
   const o=ORD[ver][pending],d=dest(o);
   if(code===d){cnt[pending]++;beep(true);toast(`✅ ${G[o[3]].name} 放對了（${LOC[code]}）`,'ok');} else {beep(false);toast(`❌ 送錯地方！${G[o[3]].name} 不該放在${LOC[code]}`,'bad');}
   pending=null;$('pending').style.display='none';render();return;}
 if(!G[code]){toast('看不懂這個代碼，再掃一次','warn');return;}
 const i=ORD[ver].findIndex(o=>o[3]===code);
 if(i<0){beep(false);toast(`❌ 退件！「${G[code].name}」不在你們的訂單上`,'bad');return;}
 const o=ORD[ver][i];
 if(cnt[i]>=o[4]){beep(false);toast(`⚠️ ${o[1]} 的「${G[code].name}」已經夠了，不用再拿！`,'warn');return;}
 if($('needLoc').checked){pending=i;beep(true);$('pending').style.display='block';$('pending').textContent=`📦 ${G[code].name}（${o[1]}・${o[2]}）確認無誤！請掃描要放的位置 QR Code`;toast(`✅ ${G[code].name} 正確！現在掃位置`,'ok');}
 else{cnt[i]++;beep(true);toast(`✅ ${G[code].name} 正確！送到${LOC[dest(o)]}`,'ok');render();}}
async function startCam(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});const v=$('video');v.srcObject=stream;await v.play();$('cammsg').textContent='把 QR Code 放進黃色框框裡';loop();}
 catch(e){$('cammsg').textContent='無法開啟相機，請改用下方輸入代碼';}}
function stopCam(){cancelAnimationFrame(raf);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;}
const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});let det=null;try{if('BarcodeDetector' in window)det=new BarcodeDetector({formats:['qr_code']});}catch(e){det=null;}
async function loop(){const v=$('video');if(v.readyState>=2){
  if(det){try{const r=await det.detect(v);if(r.length)handle(r[0].rawValue);}catch(e){}}
  else if(window.jsQR){cv.width=v.videoWidth;cv.height=v.videoHeight;cx.drawImage(v,0,0);const d=cx.getImageData(0,0,cv.width,cv.height);const q=jsQR(d.data,d.width,d.height);if(q)handle(q.data);}}
 raf=requestAnimationFrame(loop);}
function start(v){ver=v;cnt=ORD[ver].map(()=>0);pending=null;ended=false;$('pending').style.display='none';$('vlabel').textContent=`${v} 版・驗貨站`;
 $('s1').style.display='none';$('s3').style.display='none';$('s2').style.display='block';t0=Date.now();clearInterval(timer);
 timer=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);$('clock').textContent=`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;},500);render();startCam();}
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>start(b.dataset.v));
$('go').onclick=()=>{handle($('code').value);$('code').value='';};$('code').addEventListener('keydown',e=>{if(e.key==='Enter')$('go').click();});
$('back').onclick=()=>{stopCam();clearInterval(timer);$('s2').style.display='none';$('s1').style.display='block';};
$('again').onclick=()=>{$('s3').style.display='none';$('s1').style.display='block';};
})();
</script></body></html>
