 else{const o=ORD[id];$('oclub').textContent=`委託單 ${id}・${o[0]}`;$('oname').textContent=o[1];$('okind').textContent=o[2];$('okind').style.background=o[2]==='送貨'?'#1e73c8':'#e8743b';
   $('ohint').textContent=o[2]==='送貨'?'到碼頭倉庫（寄件區）找貨 → 掃貨物 → 掃要放的港口（冷藏冷凍放基隆港、常溫放高雄港）':'到港口貨櫃找包裹 → 掃貨物 → 掃取件區';t0=Date.now();}
 $('wait').style.display='none';$('work').style.display='block';clearInterval(timer);timer=setInterval(tick,500);render();toast(isTy()?`🌀 ${id} 開始！`:`📋 接到 ${ORD[id][1]} 的委託單！`,'info');beep(true);}
function tick(){const s=Math.floor((Date.now()-t0)/1000);$('clock').textContent=`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;}
function render(){const list=items();$('prog').textContent=`${ok.filter(Boolean).length}／${list.length}`;
 $('items').innerHTML=list.map((c,i)=>`<div class="it ${ok[i]?'ok':''}">${G[c][0]}</div>`).join('');
 if(!ok.every(Boolean))return;
 if(isTy()){const v=cur[1],n=+cur.slice(2);tyNext[v]=n+1;
   if(n<12){toast(`✅ ${cur} 完成！請掃 T${v}${n+1}`,'ok');beep(true);cur=null;$('work').style.display='none';$('wait').style.display='block';return;}
   clearInterval(timer);$('win').style.background='#5b2a86';$('wname').textContent=`🌀 颱風大單完成！（${v} 隊）`;$('wmeta').textContent=`12 張全部退回原位・總用時 ${$('clock').textContent}`;$('win').classList.add('show');beep(true);return;}
 clearInterval(timer);const o=ORD[cur],v=cur[0];$('win').style.background=COLORS[v];$('wname').textContent=`${o[1]}（${cur}）`;
 $('wmeta').textContent=`${o[0]}・${o[2]} 6 樣全部完成・用時 ${$('clock').textContent}`;$('win').classList.add('show');beep(true);}
function handle(raw){let code=String(raw).trim().toUpperCase().replace(/^DRIFT:/,'').replace(/^ORDER-/,'').replace(/^L-/,'');const now=Date.now();if(code===last&&now-lastT<2000)return;last=code;lastT=now;
 if(ORD[code]){ if(cur&&!ok.every(Boolean)&&code!==cur){toast('這張單還沒完成，先完成這一張！','warn');return;} if(code!==cur||ok.every(Boolean))load(code);return;}
 if(!cur){toast('請先掃描委託單卡','info');return;}
 if(LOC[code]){ if(pending===null){toast('請先掃描貨物，再掃位置','info');return;}
   const c=items()[pending];
   if(code===dest(c)){ok[pending]=true;beep(true);toast(`✅ ${G[c][0]} 放對了（${LOC[code]}）`,'ok');} else {beep(false);toast(`❌ 送錯地方！${G[c][0]} 不該放在${LOC[code]}`,'bad');}
   pending=null;$('pending').style.display='none';render();return;}
 if(!G[code]){toast('看不懂這個代碼，再掃一次','warn');return;}
 const i=items().indexOf(code);
 if(i<0){beep(false);toast(`❌ 退件！「${G[code][0]}」不在這張單上`,'bad');return;}
 if(ok[i]){beep(false);toast(`⚠️「${G[code][0]}」已經完成了`,'warn');return;}
 pending=i;beep(true);$('pending').style.display='block';$('pending').textContent=`📦 ${G[code][0]} 正確！請掃描要放的位置 QR Code`;toast(`✅ ${G[code][0]} 正確！現在掃位置`,'ok');}
async function startCam(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});const v=$('video');v.srcObject=stream;await v.play();$('cammsg').textContent='把 QR Code 放進黃色框框裡';$('camon').style.display='none';loop();}
 catch(e){$('cammsg').textContent='無法開啟相機，請改用下方輸入代碼';}}
const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});let det=null;try{if('BarcodeDetector' in window)det=new BarcodeDetector({formats:['qr_code']});}catch(e){det=null;}
async function loop(){const v=$('video');if(v.readyState>=2){
  if(det){try{const r=await det.detect(v);if(r.length)handle(r[0].rawValue);}catch(e){}}
  else if(window.jsQR){cv.width=v.videoWidth;cv.height=v.videoHeight;cx.drawImage(v,0,0);const d=cx.getImageData(0,0,cv.width,cv.height);const q=jsQR(d.data,d.width,d.height);if(q)handle(q.data);}}
 raf=requestAnimationFrame(loop);}
$('camon').onclick=startCam;$('go').onclick=()=>{handle($('code').value);$('code').value='';};$('code').addEventListener('keydown',e=>{if(e.key==='Enter')$('go').click();});
$('next').onclick=()=>{$('win').classList.remove('show');cur=null;$('work').style.display='none';$('wait').style.display='block';toast('請下一位掃描新的委託單卡','info');};
})();
</script></body></html>
